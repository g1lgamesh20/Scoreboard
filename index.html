<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Scoreboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background-color: #1a1a1a; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #ff3333;
        }
        h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        #league-indicator { color: #ff3333; font-weight: bold; }
        #clock { font-size: 1.5rem; font-family: monospace; background: #000000; padding: 5px 15px; border-radius: 4px; border: 1px solid #333; }
        #scoreboard-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; padding: 20px; overflow-y: auto; align-content: start; }
        .game-card { background-color: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #2d2d2d; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; }
        .status { font-size: 0.85rem; color: #aaaaaa; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .status.live { color: #ff3333; }
        .team-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
        .team-info { display: flex; align-items: center; gap: 12px; }
        .team-logo { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.65)); }
        .team-name { font-size: 1.2rem; font-weight: 600; }
        .team-score { font-size: 1.6rem; font-weight: bold; font-family: monospace; }
        .no-games { grid-column: 1 / -1; text-align: center; font-size: 1.2rem; color: #888; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>Live Scores: <span id="league-indicator">Loading...</span></h1>
        <div id="clock">00:00:00 AM</div>
    </header>
    <div id="scoreboard-container"></div>

    <script>
        const leagues = ['nfl', 'nba', 'mlb', 'nhl'];
        let currentIdx = 0;

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchScores() {
            const league = leagues[currentIdx];
            document.getElementById('league-indicator').innerText = league.toUpperCase();
            const container = document.getElementById('scoreboard-container');

            // Force index progression forward immediately
            currentIdx = (currentIdx + 1) % leagues.length;

            try {
                const response = await fetch(`./data-${league}.json?cb=${new Date().getTime()}`);
                if (!response.ok) throw new Error("File missing");
                
                const events = await response.json();
                container.innerHTML = '';

                if (events.length === 0) {
                    container.innerHTML = `<div class="no-games">No active games scheduled for ${league.toUpperCase()} today.</div>`;
                    return;
                }

                events.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="status ${game.isLive ? 'live' : ''}">${game.isLive ? '● ' : ''}${game.status}</div>
                        <div class="team-row">
                            <div class="team-info">
                                <img class="team-logo" src="${game.awayLogo}" alt="">
                                <span class="team-name">${game.awayName}</span>
                            </div>
                            <span class="team-score">${game.awayScore}</span>
                        </div>
                        <div class="team-row">
                            <div class="team-info">
                                <img class="team-logo" src="${game.homeLogo}" alt="">
                                <span class="team-name">${game.homeName}</span>
                            </div>
                            <span class="team-score">${game.homeScore}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = `<div class="no-games">Syncing local scoreboard channels...</div>`;
            }
        }

        // Initialize and rotate across modules every 15 seconds
        fetchScores();
        setInterval(fetchScores, 15000);
    </script>
</body>
</html>
