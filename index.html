<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>Sports Central Jumbotron</title>
<style>
:root{--bg:#05070a;--panel:#111b29;--blue:#00bfff;--green:#39ff88;--red:#f12635;--gold:#ffc857;--text:#f5f8ff;--muted:#8b9bb0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;min-height:0}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 20px;background:linear-gradient(100deg,#12243a,#070a10);border-bottom:3px solid var(--blue)}
h1{margin:0;display:flex;align-items:center;gap:9px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(22px,3vw,40px);font-style:italic;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;line-height:1;transform:skewX(-4deg);filter:drop-shadow(0 2px 0 #071a2b)}.brand-icon{font-family:"Segoe UI Emoji",sans-serif;font-style:normal;font-size:.78em;filter:drop-shadow(0 0 7px #00bfff88)}.brand-text{color:#f7fbff;text-shadow:2px 2px 0 #0879b8,4px 4px 0 #09263b,0 0 18px #00bfff88;letter-spacing:clamp(1px,.28vw,4px)}#clock{color:var(--green);font:bold clamp(17px,2vw,28px) Consolas,monospace;white-space:nowrap}
#toolbar{flex:0 0 auto;min-height:32px;padding:4px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#080d15;border-bottom:1px solid #203145}#message{color:var(--muted);font-size:clamp(10px,1vw,13px);letter-spacing:1px;text-transform:uppercase}
button{color:white;background:#172b40;border:1px solid #36516d;border-radius:4px;padding:5px 10px;font-weight:bold;cursor:pointer}
#scoreboard{flex:1 1 0;min-height:0;min-width:0;overflow:hidden;padding:9px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px}
.game{position:relative;min-height:0;min-width:0;overflow:hidden;padding:16px 20px;border-radius:7px;border:1px solid #263b51;background:linear-gradient(145deg,#152337,#080d14);display:flex;flex-direction:column;justify-content:space-evenly;box-shadow:inset 0 0 20px #0005}
.game.live{border-color:#248b5c;box-shadow:inset 0 0 18px #39ff8809}.game.live::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--green)}
.game-header{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:clamp(12px,1.2vw,16px);font-weight:bold;text-transform:uppercase;letter-spacing:1px}.status-live{color:var(--green)}.status-final{color:var(--gold)}.pulse{animation:pulse 1.8s infinite}
.team{display:flex;align-items:center;gap:14px;min-width:0;margin:7px 0;padding:5px 9px;border-radius:9px;background:linear-gradient(90deg,#f5f8ff0b,#f5f8ff04 72%,transparent);border:1px solid #ffffff0b}.logo{display:block;width:clamp(94px,11.625vw,156px);height:clamp(94px,11.625vw,156px);flex:0 0 auto;object-fit:contain;padding:0;border-radius:0;background:transparent;border:0;box-shadow:none;filter:drop-shadow(0 0 3px #ffffff99) drop-shadow(0 0 9px #00bfff66) drop-shadow(0 2px 2px #000b)}
.team-name{flex:1 1 auto;min-width:0;font-size:clamp(28px,3.51vw,48px);font-weight:400;line-height:1.05;color:#ffffff;text-shadow:0 2px 2px #000,0 0 8px #000b;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}.score{flex:0 0 auto;min-width:85px;text-align:right;font:900 clamp(61px,7.62vw,105px) Consolas,monospace;color:#fff;text-shadow:0 0 12px #00bfff22}.game.live .score{color:#fff;text-shadow:0 0 12px #00bfff55}.score.winner{color:#ffd34d;text-shadow:0 0 10px #ffc857aa,0 0 24px #ffc85766}.game:not(.live) .score.winner{color:#ffd34d}
.score.score-flash{animation:score-pop 1.25s ease-out}.game-footer{color:#71859b;font-size:clamp(10px,1vw,13px);text-align:right;text-transform:uppercase;letter-spacing:1px}
#empty{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(ellipse,#10243b,#05070a 75%)}#empty h2{margin:0;color:var(--blue);font-size:clamp(24px,4vw,52px);letter-spacing:4px;text-shadow:0 0 20px #00bfff44}#idle-clock{color:var(--green);font:900 clamp(34px,6vw,76px) Consolas,monospace}#empty p{margin:0;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
footer{flex:0 0 50px;height:50px;min-width:0;display:flex;align-items:stretch;overflow:hidden;background:#080d15;border-top:2px solid var(--blue)}.ticker-label{flex:0 0 auto;display:flex;align-items:center;padding:0 15px;background:var(--red);color:white;font-size:14px;font-weight:900;letter-spacing:1.3px;white-space:nowrap;text-shadow:0 1px 3px #0008}#ticker-window{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;display:flex;align-items:center}#ticker-track{display:flex;align-items:center;width:max-content;flex:0 0 auto;animation:ticker-scroll 60s linear infinite;will-change:transform}#ticker-track:hover{animation-play-state:paused}.ticker-item{display:inline-flex;align-items:center;gap:9px;padding:0 20px;font:bold clamp(15px,1.65vw,20px) Consolas,monospace;white-space:nowrap}.ticker-league{color:var(--blue)}.ticker-live{color:var(--green)}.ticker-final{color:var(--gold)}.ticker-score{color:white}.ticker-separator{color:#52677e;padding-left:10px}#updated{flex:0 0 auto;display:flex;align-items:center;padding:0 11px;color:var(--muted);background:#080d15;font-size:12px;white-space:nowrap}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.58}}
/* Score-change broadcast alert */
#score-alert{position:fixed;z-index:9999;top:17%;left:50%;width:min(90vw,760px);padding:22px 28px;transform:translate(-50%,-25px) scale(.92);opacity:0;visibility:hidden;pointer-events:none;text-align:center;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(110deg,#101b2b 0%,#183552 50%,#101b2b 100%);box-shadow:0 0 18px #00bfff88,0 0 55px #ffc85755,inset 0 0 24px #00bfff22}
#score-alert.show{visibility:visible;animation:score-alert-in 5.1s ease forwards}#score-alert-kicker{color:var(--gold);font-size:clamp(13px,2vw,20px);font-weight:900;letter-spacing:4px;text-transform:uppercase}#score-alert-title{margin:8px 0;color:#fff;font-size:clamp(27px,5vw,50px);font-weight:1000;text-transform:uppercase;text-shadow:0 0 12px #00bfff,0 0 28px #00bfff88}#score-alert-detail{color:#fff;font-size:clamp(15px,2.5vw,24px);font-weight:800}
@keyframes score-alert-in{0%{opacity:0;transform:translate(-50%,-35px) scale(.84)}8%,74%{opacity:1;transform:translate(-50%,0) scale(1)}15%,30%,45%{box-shadow:0 0 35px #ffc857,0 0 80px #00bfff99}22%,37%,52%{box-shadow:0 0 18px #00bfff88,0 0 40px #ffc85755}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
@keyframes score-pop{0%{color:var(--gold);transform:scale(1.5);text-shadow:0 0 24px var(--gold)}65%{color:#fff;transform:scale(1.08)}100%{color:#fff;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#score-alert.show{animation:none;opacity:1;visibility:visible}.score.score-flash{animation:none;color:var(--gold)}}
@media(max-height:520px){header{padding:4px 12px}h1{font-size:18px;letter-spacing:1px}#clock{font-size:17px}#toolbar{min-height:27px;padding:2px 9px}button{padding:3px 7px;font-size:11px}#scoreboard{padding:5px;gap:5px}.game{padding:8px 12px}.team{gap:10px;margin:4px 0;padding:3px 6px}.logo{width:clamp(76px,10vw,109px);height:clamp(76px,10vw,109px);padding:0}.team-name{font-size:clamp(25px,3.2vw,39px)}.score{min-width:67px;font-size:clamp(48px,5.3vw,71px)}.game-header{font-size:11px}.game-footer{font-size:10px}footer{flex-basis:42px;height:42px}.ticker-label{padding:0 10px;font-size:12px}.ticker-item{padding:0 13px;font-size:15px;gap:7px}#updated{padding:0 6px;font-size:10px}#score-alert{top:12%;padding:12px 16px}}
@media(max-width:520px){header{padding:8px}h1{font-size:clamp(17px,4vw,22px);letter-spacing:1px;gap:5px}.brand-text{letter-spacing:1px}#clock{font-size:15px}#scoreboard{padding:5px;gap:5px}.game{padding:7px}.team{gap:6px;padding:3px 4px}.logo{width:50px;height:50px;padding:0}.team-name{font-size:17px}.score{min-width:40px;font-size:32px}.ticker-label{padding:0 6px;font-size:10px}.ticker-item{font-size:13px;padding:0 10px;gap:6px}#updated{display:none}}
</style>
</head>
<body>
<header><h1><span class="brand-icon" aria-hidden="true">🏟</span><span class="brand-text">Sports Central</span></h1><div id="clock">--:--:--</div></header>
<div id="toolbar"><div id="message">Connecting to sports feeds...</div><button id="fullscreen">⛶ FULLSCREEN</button></div>
<main id="scoreboard"><div id="empty"><h2>SPORTS CENTRAL</h2><div id="idle-clock">--:--</div><p>Connecting to live scores...</p></div></main>
<div id="score-alert" role="alert" aria-live="assertive"><div id="score-alert-kicker">⚡ SCORE UPDATE ⚡</div><div id="score-alert-title">SCORE!</div><div id="score-alert-detail">A team has scored!</div></div>
<footer><div class="ticker-label">SCORE CENTER</div><div id="ticker-window"><div id="ticker-track"><span class="ticker-item">CONNECTING TO LIVE SCORES...</span></div></div><div id="updated">STARTING</div></footer>
<script>
"use strict";
const API="https://site.api.espn.com/apis/site/v2/sports";
const leagues=[
 {name:"NFL",path:"football/nfl"},
 {name:"NCAA FOOTBALL",path:"football/college-football?groups=80"},
 {name:"MLB",path:"baseball/mlb"},
 {name:"NBA",path:"basketball/nba"},
 {name:"NHL",path:"hockey/nhl"}
];
const board=document.getElementById("scoreboard"),message=document.getElementById("message"),updated=document.getElementById("updated"),tickerTrack=document.getElementById("ticker-track");
let displayedGames=[],recentGames=[],gamePage=0,recentPage=0,displayMode="idle",tickerSignature="",refreshing=false,lastGoodDataTime=0;
let previousScores=null,scoreAlertTimer=null;
function localDate(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("")}
function dateOffset(days){const d=new Date();d.setDate(d.getDate()+days);return localDate(d)}
function isMarchMadnessWindow(){const now=new Date(),month=now.getMonth(),day=now.getDate();return (month===2&&day>=15)||(month===3&&day<=10)}
function enabledLeagues(){const result=[...leagues];if(isMarchMadnessWindow())result.push({name:"NCAA BASKETBALL",path:"basketball/mens-college-basketball?seasontype=3"});return result}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch])}
async function getScoreboard(league,date=null){const parts=league.path.split("?"),path=parts[0],params=new URLSearchParams(parts[1]||"");if(date)params.set("dates",date);const response=await fetch(`${API}/${path}/scoreboard?${params.toString()}`,{cache:"no-store"});if(!response.ok)throw new Error(`${league.name}: HTTP ${response.status}`);return response.json()}
function gameInfo(event,leagueName){const comp=event.competitions?.[0];if(!comp)return null;const competitors=comp.competitors||[],away=competitors.find(t=>t.homeAway==="away"),home=competitors.find(t=>t.homeAway==="home");if(!away||!home)return null;const statusType=event.status?.type||comp.status?.type||{},state=statusType.state||(statusType.completed?"post":"pre"),isLive=state==="in",isFinal=state==="post"||statusType.completed===true;const status=isLive?(event.status?.type?.shortDetail||event.status?.type?.detail||"LIVE"):isFinal?"FINAL":(event.status?.type?.shortDetail||event.status?.type?.detail||"UPCOMING");return{id:`${leagueName}-${event.id}`,league:leagueName,date:event.date,isLive,isFinal,status,away,home,venue:comp.venue?.fullName||""}}
function isToday(game){return !!game.date&&localDate(new Date(game.date))===localDate()}
function sortGames(games){return games.sort((a,b)=>{const rank=g=>g.isLive?0:g.isFinal?2:1,rankDiff=rank(a)-rank(b);if(rankDiff)return rankDiff;if(a.isLive&&b.isLive)return new Date(b.date)-new Date(a.date);return new Date(a.date||0)-new Date(b.date||0)})}
function teamDisplayName(team){return team?.team?.displayName||team?.team?.shortDisplayName||team?.team?.name||"Unknown"}
function teamShortName(team){return team?.team?.abbreviation||team?.team?.shortDisplayName||team?.team?.name||"TEAM"}
function teamLogo(team){return team?.team?.logo||""}
function numericScore(team){const value=team?.score;if(value===null||value===undefined||value==="")return null;const n=Number(value);return Number.isFinite(n)?n:null}
function showScoreAlert(changes){if(!changes.length)return;const alertBox=document.getElementById("score-alert"),title=document.getElementById("score-alert-title"),detail=document.getElementById("score-alert-detail"),kicker=document.getElementById("score-alert-kicker"),change=changes[0];const labels={"NFL":"TOUCHDOWN / SCORE UPDATE","NCAA FOOTBALL":"COLLEGE FOOTBALL SCORE","MLB":"RUN SCORED!","NBA":"BASKET!","NHL":"GOAL!","NCAA BASKETBALL":"BASKET!"};kicker.textContent=`⚡ ${labels[change.league]||"SCORE UPDATE"} ⚡`;title.textContent=`${change.team} SCORES!`;detail.textContent=`${change.awayName} ${change.awayScore} — ${change.homeName} ${change.homeScore}${changes.length>1?`  •  +${changes.length-1} other score update(s)`:""}`;alertBox.classList.remove("show");void alertBox.offsetWidth;alertBox.classList.add("show");clearTimeout(scoreAlertTimer);scoreAlertTimer=setTimeout(()=>alertBox.classList.remove("show"),5200)}
function detectScoreChanges(games){const current=new Map(),changes=[];for(const game of games){const awayScore=numericScore(game.away),homeScore=numericScore(game.home);current.set(game.id,{awayScore,homeScore,league:game.league});if(!previousScores)continue;const prev=previousScores.get(game.id);if(!prev||!game.isLive)continue;if(awayScore!==null&&prev.awayScore!==null&&awayScore>prev.awayScore)changes.push({league:game.league,team:teamDisplayName(game.away),awayName:teamShortName(game.away),homeName:teamShortName(game.home),awayScore,homeScore:homeScore??"–"});if(homeScore!==null&&prev.homeScore!==null&&homeScore>prev.homeScore)changes.push({league:game.league,team:teamDisplayName(game.home),awayName:teamShortName(game.away),homeName:teamShortName(game.home),awayScore:awayScore??"–",homeScore})}previousScores=current;if(changes.length)showScoreAlert(changes)}
function renderGame(game){const away=game.away,home=game.home,awayName=teamDisplayName(away),homeName=teamDisplayName(home),awayLogo=teamLogo(away),homeLogo=teamLogo(home),awayScore=away.score??"–",homeScore=home.score??"–",statusClass=game.isLive?"status-live pulse":game.isFinal?"status-final":"",statusText=game.isLive?`● ${game.status}`:game.status;let footerText="";if(game.isLive)footerText=game.status;else if(game.isFinal)footerText="COMPLETED";else if(game.date)footerText=new Date(game.date).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"});return `<article class="game ${game.isLive?"live":""}"><div class="game-header"><span>${escapeHTML(game.league)}</span><span class="${statusClass}">${escapeHTML(statusText)}</span></div><div><div class="team">${awayLogo?`<img class="logo" src="${escapeHTML(awayLogo)}" alt="${escapeHTML(awayName)} logo" onerror="this.style.visibility='hidden'">`:""}<span class="team-name" title="${escapeHTML(awayName)}">${escapeHTML(awayName)}</span><span class="score${game.isFinal&&numericScore(away)!==null&&numericScore(home)!==null&&numericScore(away)>numericScore(home)?" winner":""}">${escapeHTML(awayScore)}</span></div><div class="team">${homeLogo?`<img class="logo" src="${escapeHTML(homeLogo)}" alt="${escapeHTML(homeName)} logo" onerror="this.style.visibility='hidden'">`:""}<span class="team-name" title="${escapeHTML(homeName)}">${escapeHTML(homeName)}</span><span class="score${game.isFinal&&numericScore(away)!==null&&numericScore(home)!==null&&numericScore(home)>numericScore(away)?" winner":""}">${escapeHTML(homeScore)}</span></div></div><div class="game-footer">${escapeHTML(footerText)}</div></article>`}
function pageSize(){return window.innerHeight<=520?2:4}
function renderIdle(title,subtitle){board.innerHTML=`<div id="empty"><h2>${escapeHTML(title)}</h2><div id="idle-clock">--:--</div><p>${escapeHTML(subtitle)}</p></div>`;displayMode="idle"}
function renderCurrentPage(){if(!displayedGames.length){renderIdle("SPORTS CENTRAL","Waiting for the next game...");return}const size=pageSize(),pages=Math.ceil(displayedGames.length/size);gamePage=gamePage%pages;const games=displayedGames.slice(gamePage*size,gamePage*size+size);board.innerHTML=games.map(renderGame).join("");displayMode="current"}
function renderRecentPage(){if(!recentGames.length){renderIdle("SPORTS CENTRAL","Waiting for the next game...");return}const size=pageSize(),pages=Math.ceil(recentGames.length/size);recentPage=recentPage%pages;const games=recentGames.slice(recentPage*size,recentPage*size+size);board.innerHTML=games.map(renderGame).join("");displayMode="recent"}
function tickerMarkup(games){if(!games.length)return `<span class="ticker-item">NO GAMES AVAILABLE — CHECKING FOR UPDATES</span>`;return games.map(game=>{const awayName=teamShortName(game.away),homeName=teamShortName(game.home),status=game.isLive?`<span class="ticker-live">● LIVE ${escapeHTML(game.status)}</span>`:game.isFinal?`<span class="ticker-final">FINAL</span>`:`<span>${escapeHTML(game.status)}</span>`,score=`${awayName} ${game.away.score??"–"} - ${game.home.score??"–"} ${homeName}`;return `<span class="ticker-item"><span class="ticker-league">${escapeHTML(game.league)}</span>${status}<span class="ticker-score">${escapeHTML(score)}</span><span class="ticker-separator">◆</span></span>`}).join("")}
function updateTicker(games){const content=tickerMarkup(games);if(content===tickerSignature)return;tickerSignature=content;tickerTrack.innerHTML=content+content;tickerTrack.style.animation="none";void tickerTrack.offsetWidth;tickerTrack.style.animation=""}
function updateClock(){const now=new Date();document.getElementById("clock").textContent=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"});const idleClock=document.getElementById("idle-clock");if(idleClock)idleClock.textContent=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
async function loadRecentGames(activeLeagues){message.textContent="NO GAMES TODAY • LOADING RECENT FINALS";const jobs=[];for(const league of activeLeagues){for(let ago=1;ago<=2;ago++){jobs.push(getScoreboard(league,dateOffset(-ago)).then(data=>(data.events||[]).map(event=>gameInfo(event,league.name)).filter(game=>game&&game.isFinal)).catch(error=>{console.warn("Recent scores unavailable:",error);return[]}))}}const results=await Promise.all(jobs),unique=new Map();results.flat().forEach(game=>unique.set(game.id,game));recentGames=[...unique.values()].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);if(recentGames.length){recentPage=0;renderRecentPage();updateTicker(recentGames);message.textContent="NO GAMES TODAY • RECENT FINALS"}else{renderIdle("SPORTS CENTRAL","Waiting for the next game...");updateTicker([]);message.textContent="NO RECENT GAMES AVAILABLE"}}
async function refreshScores(){if(refreshing)return;refreshing=true;try{const activeLeagues=enabledLeagues(),cutoff=Date.now()-24*60*60*1000,now=Date.now();message.textContent="UPDATING SCORES...";const results=await Promise.allSettled(activeLeagues.map(async league=>{const [todayData,yesterdayData]=await Promise.all([getScoreboard(league),getScoreboard(league,dateOffset(-1))]);const today=(todayData.events||[]).map(event=>gameInfo(event,league.name)).filter(game=>game&&(game.isLive||isToday(game)));const recent=(yesterdayData.events||[]).map(event=>gameInfo(event,league.name)).filter(game=>game&&(game.isFinal||game.isLive)&&game.date&&new Date(game.date).getTime()>=cutoff&&new Date(game.date).getTime()<=now);return{today,recent}}));let todayGames=[],recent24Games=[],successfulFeeds=0;results.forEach(result=>{if(result.status==="fulfilled"){successfulFeeds++;todayGames.push(...result.value.today);recent24Games.push(...result.value.recent)}else console.warn("Score feed failed:",result.reason)});if(successfulFeeds===0){message.textContent="FEED UNAVAILABLE • RETRYING";if(!lastGoodDataTime)renderIdle("SPORTS CENTRAL","Reconnecting to sports feeds...");updated.textContent="CONNECTION ISSUE";return}lastGoodDataTime=Date.now();const priorMode=displayMode,priorGamePage=gamePage,priorRecentPage=recentPage,hadDisplay=displayedGames.length>0||recentGames.length>0;const dedupe=list=>{const unique=new Map();list.forEach(game=>unique.set(game.id,game));return sortGames([...unique.values()])};displayedGames=dedupe(todayGames);recentGames=dedupe(recent24Games.filter(game=>!displayedGames.some(today=>today.id===game.id)));const tickerGames=dedupe([...displayedGames,...recentGames]);detectScoreChanges(tickerGames);if(displayedGames.length||recentGames.length){gamePage=priorGamePage;recentPage=priorRecentPage;if(priorMode==="recent"&&recentGames.length){renderRecentPage()}else if(priorMode==="current"&&displayedGames.length){renderCurrentPage()}else if(displayedGames.length){gamePage=0;renderCurrentPage()}else{recentPage=0;renderRecentPage()}updateTicker(tickerGames);const liveCount=tickerGames.filter(g=>g.isLive).length;message.textContent=liveCount?`${liveCount} LIVE GAME${liveCount===1?"":"S"} • TODAY + LAST 24 HOURS`:displayedGames.length&&recentGames.length?"TODAY'S GAMES • ALSO SHOWING LAST 24 HOURS":displayedGames.length?"TODAY'S GAMES • AUTO-REFRESH ON":"PAST 24 HOURS • RECENT SCORES"}else{displayedGames=[];recentGames=[];await loadRecentGames(activeLeagues)}updated.textContent="UPDATED "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})}catch(error){console.error("Scoreboard update failed:",error);message.textContent="CONNECTION ISSUE • RETRYING"}finally{refreshing=false}}
document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(error){console.warn("Fullscreen unavailable:",error)}});
setInterval(()=>{if(displayMode==="current"&&displayedGames.length){const pages=Math.ceil(displayedGames.length/pageSize());if(gamePage+1<pages){gamePage++;renderCurrentPage()}else if(recentGames.length){recentPage=0;renderRecentPage();displayMode="recent";message.textContent="PAST 24 HOURS • RECENT SCORES"}else{gamePage=0;renderCurrentPage()}}else if(displayMode==="recent"&&recentGames.length){const pages=Math.ceil(recentGames.length/pageSize());if(recentPage+1<pages){recentPage++;renderRecentPage()}else if(displayedGames.length){gamePage=0;renderCurrentPage();displayMode="current";message.textContent="TODAY'S GAMES • AUTO-REFRESH ON"}else{recentPage=0;renderRecentPage()}}},12000);
setInterval(refreshScores,30000);
window.addEventListener("resize",()=>{if(displayMode==="current")renderCurrentPage();else if(displayMode==="recent")renderRecentPage()});
updateClock();setInterval(updateClock,1000);refreshScores();
</script>
</body>
</html>
