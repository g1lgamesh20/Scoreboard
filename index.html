<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Scoreboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background-color: #1a1a1a; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #ff3333;
        }
        h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        #league-indicator { color: #ff3333; font-weight: bold; }
        #clock { font-size: 1.5rem; font-family: monospace; background: #000000; padding: 5px 15px; border-radius: 4px; border: 1px solid #333; }
        #scoreboard-container { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; padding: 20px; overflow-y: auto; align-content: start; }
        .game-card { background-color: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #2d2d2d; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; }
        .status { font-size: 0.85rem; color: #aaaaaa; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        .status.live { color: #ff3333; }
        .team-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
        .team-info { display: flex; align-items: center; gap: 12px; }
        .team-logo { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.65)); }
        .team-name { font-size: 1.2rem; font-weight: 600; }
        .team-score { font-size: 1.6rem; font-weight: bold; font-family: monospace; }
        .no-games { grid-column: 1 / -1; text-align: center; font-size: 1.2rem; color: #888; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>Live Scores: <span id="league-indicator">Loading...</span></h1>
        <div id="clock">00:00:00 AM</div>
    </header>
    <div id="scoreboard-container"></div>

    <script>
        const leagues = [
            { name: 'NFL', endpoint: 'football/nfl' },
            { name: 'NBA', endpoint: 'basketball/nba' },
            { name: 'MLB', endpoint: 'baseball/mlb' },
            { name: 'NHL', endpoint: 'hockey/nhl' },
            { name: 'NCAA Football', endpoint: 'football/college-football?groups=80' }
        ];
        
        let currentIdx = 0;

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchScores() {
            const league = leagues[currentIdx];
            document.getElementById('league-indicator').innerText = league.name;
            const container = document.getElementById('scoreboard-container');
            
            currentIdx = (currentIdx + 1) % leagues.length;

            const targetUrl = `https://espn.com{league.endpoint}/scoreboard?_cb=${new Date().getTime()}`;

            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Connection drop");
                
                const data = await response.json();
                const events = data.events || [];

                container.innerHTML = '';

                if (events.length === 0) {
                    container.innerHTML = `<div class="no-games">No active games scheduled for ${league.name} today.</div>`;
                    return;
                }

                events.forEach(game => {
                    const comp = game.competitions[0];
                    if (!comp) return;

                    const status = game.status.type.detail;
                    const isLive = game.status.type.state === 'in';
                    
                    const homeTeam = comp.competitors.find(c => c.side === 'home');
                    const awayTeam = comp.competitors.find(c => c.side === 'away');

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="status ${isLive ? 'live' : ''}">${isLive ? '● ' : ''}${status}</div>
                        <div class="team-row">
                            <div class="team-info">
                                <img class="team-logo" src="${awayTeam.team.logo || 'https://espncdn.com'}" alt="">
                                <span class="team-name">${awayTeam.team.displayName || awayTeam.team.name}</span>
                            </div>
                            <span class="team-score">${awayTeam.score || '0'}</span>
                        </div>
                        <div class="team-row">
                            <div class="team-info">
                                <img class="team-logo" src="${homeTeam.team.logo || 'https://espncdn.com'}" alt="">
                                <span class="team-name">${homeTeam.team.displayName || homeTeam.team.name}</span>
                            </div>
                            <span class="team-score">${homeTeam.score || '0'}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="no-games">Direct feed connecting...</div>`;
            }
        }

        fetchScores();
        setInterval(fetchScores, 15000);
    </script>
</body>
</html>
