<body>
<header>
  <h1>🏟 Sports Central</h1>
  <div id="clock">--:--:--</div>
</header>

<div id="toolbar">
  <div id="message">Connecting to scoreboard...</div>
  <button id="fullscreen">⛶ Fullscreen</button>
</div>

<main id="scoreboard">
  <div id="empty">
    <h2>SPORTS CENTRAL</h2>
    <div class="big-clock" id="idle-clock">--:--</div>
    <p>Connecting to live scores...</p>
  </div>
</main>

<footer>
  <span>LIVE SPORTS</span>
  <div id="ticker">NFL • NCAA FOOTBALL • MLB • NBA • NHL</div>
  <span id="updated">Starting...</span>
</footer>

<script>
"use strict";

const API = "https://site.api.espn.com/apis/site/v2/sports";

const leagues = [
  { name: "NFL", path: "football/nfl" },
  { name: "NCAA FOOTBALL", path: "football/college-football?groups=80" },
  { name: "MLB", path: "baseball/mlb" },
  { name: "NBA", path: "basketball/nba" },
  { name: "NHL", path: "hockey/nhl" }
];

const board = document.getElementById("scoreboard");
const message = document.getElementById("message");
const updated = document.getElementById("updated");

let recentGames = [];
let recentPage = 0;
let displayMode = "idle";
let refreshing = false;

function localDate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}${m}${d}`;
}

function dateOffset(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return localDate(d);
}

function isMarchMadnessWindow() {
  const now = new Date();
  const month = now.getMonth();
  const day = now.getDate();

  // Approximate men's tournament window. Adjust if needed.
  return (month === 2 && day >= 15) || (month === 3 && day <= 10);
}

function enabledLeagues() {
  const result = [...leagues];

  if (isMarchMadnessWindow()) {
    result.push({
      name: "NCAA BASKETBALL",
      path: "basketball/mens-college-basketball?seasontype=3"
    });
  }

  return result;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function getScoreboard(league, date = null) {
  let path = league.path;
  let query = "";

  if (path.includes("?")) {
    const parts = path.split("?");
    path = parts[0];
    query = parts[1];
  }

  const params = new URLSearchParams(query);
  if (date) params.set("dates", date);

  const url = `${API}/${path}/scoreboard?${params.toString()}`;

  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`${league.name}: HTTP ${response.status}`);
  }

  return response.json();
}

function gameInfo(event, leagueName) {
  const comp = event.competitions?.[0];
  if (!comp) return null;

  const teams = comp.competitors || [];
  const away = teams.find(t => t.homeAway === "away");
  const home = teams.find(t => t.homeAway === "home");

  if (!away || !home) return null;

  const statusType = event.status?.type || comp.status?.type || {};
  const state = statusType.state || (
    statusType.completed ? "post" : "pre"
  );

  const isLive = state === "in";
  const isFinal = state === "post" || statusType.completed === true;

  const status = isLive
    ? (event.status?.type?.shortDetail ||
       event.status?.type?.detail ||
       "LIVE")
    : isFinal
      ? "FINAL"
      : (event.status?.type?.shortDetail ||
         event.status?.type?.detail ||
         "UPCOMING");

  return {
    id: event.id,
    league: leagueName,
    date: event.date,
    isLive,
    isFinal,
    status,
    away,
    home,
    eventName: event.name || "",
    venue: comp.venue?.fullName || ""
  };
}

function isToday(game) {
  if (!game.date) return false;
  return localDate(new Date(game.date)) === localDate();
}

function sortGames(games) {
  return games.sort((a, b) => {
    // Live games first, then upcoming, then completed.
    const rank = g => g.isLive ? 0 : g.isFinal ? 2 : 1;
    const diff = rank(a) - rank(b);
    if (diff !== 0) return diff;

    return new Date(a.date || 0) - new Date(b.date || 0);
  });
}

function renderGame(game) {
  const away = game.away;
  const home = game.home;

  const awayTeam = away.team || {};
  const homeTeam = home.team || {};

  const awayName = awayTeam.abbreviation ||
    awayTeam.shortDisplayName || awayTeam.displayName || "AWAY";
  const homeName = homeTeam.abbreviation ||
    homeTeam.shortDisplayName || homeTeam.displayName || "HOME";

  const awayScore = away.score ?? "–";
  const homeScore = home.score ?? "–";

  const awayLogo = awayTeam.logo || "";
  const homeLogo = homeTeam.logo || "";

  const statusClass = game.isLive
    ? "status-live pulse"
    : game.isFinal ? "status-final" : "";

  const statusText = game.isLive
    ? `● ${game.status}`
    : game.status;

  const when = game.date
    ? new Date(game.date).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      })
    : "";

  return `
    <article class="game ${game.isLive ? "live" : ""}">
      <div class="game-header">
        <span>${escapeHTML(game.league)}</span>
        <span class="${statusClass}">${escapeHTML(statusText)}</span>
      </div>

      <div>
        <div class="team">
          ${awayLogo
            ? `<img class="logo" src="${escapeHTML(awayLogo)}" alt=""
                    onerror="this.style.display='none'">`
            : ""}
          <span class="team-name" title="${escapeHTML(awayTeam.displayName || awayName)}">
            ${escapeHTML(awayName)}
          </span>
          <span class="score">${escapeHTML(awayScore)}</span>
        </div>

        <div class="team">
          ${homeLogo
            ? `<img class="logo" src="${escapeHTML(homeLogo)}" alt=""
                    onerror="this.style.display='none'">`
            : ""}
          <span class="team-name" title="${escapeHTML(homeTeam.displayName || homeName)}">
            ${escapeHTML(homeName)}
          </span>
          <span class="score">${escapeHTML(homeScore)}</span>
        </div>
      </div>

      <div class="game-footer">
        ${game.isFinal ? "COMPLETED" : game.isLive ? "IN PROGRESS" : escapeHTML(when)}
      </div>
    </article>`;
}

function renderIdle(title, subtitle) {
  board.innerHTML = `
    <div id="empty">
      <h2>${escapeHTML(title)}</h2>
      <div class="big-clock" id="idle-clock">--:--</div>
      <p>${escapeHTML(subtitle)}</p>
    </div>`;
  displayMode = "idle";
}

function renderGames(games, mode) {
  if (!games.length) {
    renderIdle("SPORTS CENTRAL", "No games found. Checking again soon.");
    return;
  }

  const pageSize = 6;
  let visibleGames = games;

  if (mode === "recent" && games.length > pageSize) {
    const pages = Math.ceil(games.length / pageSize);
    recentPage = recentPage % pages;
    const start = recentPage * pageSize;
    visibleGames = games.slice(start, start + pageSize);
  }

  board.innerHTML = visibleGames.map(renderGame).join("");
  displayMode = mode;
}

async function refreshScores() {
  if (refreshing) return;
  refreshing = true;

  try {
    const activeLeagues = enabledLeagues();

    message.textContent = "Updating scores...";

    const results = await Promise.allSettled(
      activeLeagues.map(async league => {
        const data = await getScoreboard(league);
        const events = data.events || [];
        return events
          .map(event => gameInfo(event, league.name))
          .filter(Boolean);
      })
    );

    let todayGames = [];
    let errors = 0;

    results.forEach(result => {
      if (result.status === "fulfilled") {
        todayGames.push(...result.value.filter(game =>
          game.isLive || isToday(game)
        ));
      } else {
        errors++;
        console.warn("Scoreboard request failed:", result.reason);
      }
    });

    todayGames = sortGames(todayGames);

    const liveGames = todayGames.filter(game => game.isLive);
    const nonFinalToday = todayGames.filter(game => !game.isFinal);

    if (liveGames.length || nonFinalToday.length) {
      renderGames(todayGames, "current");
      message.textContent = liveGames.length
        ? `${liveGames.length} LIVE GAME${liveGames.length === 1 ? "" : "S"} • AUTO-REFRESH ENABLED`
        : "TODAY'S SCHEDULE • AUTO-REFRESH ENABLED";
    } else {
      await loadRecentGames(activeLeagues);
    }

    updated.textContent = errors === activeLeagues.length
      ? "Feed unavailable"
      : `Updated ${new Date().toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit"
        })}`;

  } catch (error) {
    console.error(error);
    message.textContent = "Connection issue • Retrying automatically";
    if (displayMode === "idle") {
      renderIdle("SPORTS CENTRAL", "Waiting for sports data...");
    }
  } finally {
    refreshing = false;
  }
}

async function loadRecentGames(activeLeagues) {
  // Reuse cached finals if we already have them and can show them.
  if (recentGames.length) {
    renderGames(recentGames, "recent");
    message.textContent = "NO GAMES TODAY • RECENT FINALS";
    return;
  }

  message.textContent = "NO GAMES TODAY • LOADING RECENT FINALS";

  const jobs = [];

  for (const league of activeLeagues) {
    for (let daysAgo = 1; daysAgo <= 3; daysAgo++) {
      jobs.push((async () => {
        const data = await getScoreboard(league, dateOffset(-daysAgo));
        return (data.events || [])
          .map(event => gameInfo(event, league.name))
          .filter(game => game && game.isFinal);
      })());
    }
  }

  const results = await Promise.allSettled(jobs);
  const games = [];

  results.forEach(result => {
    if (result.status === "fulfilled") {
      games.push(...result.value);
    }
  });

  const unique = new Map();
  games.forEach(game => unique.set(game.id, game));

  recentGames = [...unique.values()]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 36);

  if (recentGames.length) {
    renderGames(recentGames, "recent");
    message.textContent = "NO GAMES TODAY • RECENT FINALS";
  } else {
    renderIdle("SPORTS CENTRAL", "Waiting for the next game...");
    message.textContent = "NO RECENT GAMES AVAILABLE";
  }
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });

  const idleClock = document.getElementById("idle-clock");
  if (idleClock) {
    idleClock.textContent = now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });
  }
}

document.getElementById("fullscreen").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.warn("Fullscreen unavailable:", error);
  }
});

setInterval(updateClock, 1000);

// Cycle through pages of recent finals every 12 seconds.
setInterval(() => {
  if (displayMode === "recent" && recentGames.length > 6) {
    recentPage++;
    renderGames(recentGames, "recent");
  }
}, 12000);

// Refresh live and scheduled scores every 30 seconds.
updateClock();
refreshScores();
setInterval(refreshScores, 30000);
</script>
</body>
</html>
