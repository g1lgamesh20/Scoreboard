name: Fetch Sports Data
on:
  schedule:
    - cron: '*/5 * * * *' # Updates automatically every 5 minutes
  workflow_dispatch: # Allows manual force refreshes via the action panel

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Data Collector Script
        run: python3 process_scores.py

      - name: Commit and Save Data Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data-*.json
          git diff-index --quiet HEAD || git commit -m "Automated scoreboard cache data update"
          git push
